openapi: 3.0.3
info:
  title: Test Pet Store API
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      tags:
        - pets
      summary: List all pets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      tags:
        - pets
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: The created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      operationId: getPet
      tags:
        - pets
      summary: Get a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
  /requests:
    post:
      operationId: createRequest
      tags:
        - requests
      summary: Create a request with an optional photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateRequestRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestRequest'
      responses:
        '204':
          description: Request created
  /messages:
    post:
      operationId: sendMessage
      tags:
        - requests
      summary: Send a message whose JSON variant omits the file fields
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/json:
            schema:
              type: object
              properties:
                textContent:
                  type: string
      responses:
        '204':
          description: Message sent
  /files/{id}:
    get:
      operationId: downloadFile
      tags:
        - requests
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /documents:
    put:
      operationId: replaceDocument
      tags:
        - requests
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Document'
      responses:
        '200':
          description: The stored document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
components:
  schemas:
    Document:
      type: object
      properties:
        contents:
          type: string
          format: binary
    Pet:
      type: object
      required:
        - id
        - name
        - owner
      properties:
        id:
          type: string
        name:
          type: string
        tag:
          type: string
        owner:
          $ref: '#/components/schemas/Owner'
    CreatePetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        tag:
          type: string
    Owner:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    SendMessageRequest:
      type: object
      properties:
        textContent:
          type: string
        attachments:
          type: array
          items:
            type: string
            format: binary
    CreateRequestRequest:
      type: object
      required:
        - description
        - serviceAddress
      properties:
        description:
          type: string
        serviceAddress:
          type: object
          required:
            - city
          properties:
            city:
              type: string
        photo:
          type: string
          format: binary
        attachments:
          type: array
          items:
            type: string
            format: binary
