openapi: 3.1.0
info:
  title: OpenAPI 3.1 uploads
  version: '1'
paths:
  /avatars:
    post:
      operationId: setAvatar
      tags:
        - avatars
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetAvatarInput'
      responses:
        '200':
          description: The previous avatar, if any
          content:
            application/octet-stream:
              schema:
                type:
                  - string
                  - 'null'
                format: binary
  /exports:
    post:
      operationId: createExport
      tags:
        - avatars
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportFile'
      responses:
        '204':
          description: Created
  /exports/latest:
    $ref: '#/components/pathItems/LatestExport'
components:
  pathItems:
    LatestExport:
      get:
        operationId: getLatestExport
        tags:
          - avatars
        responses:
          '200':
            description: The latest export
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ExportFile'
  schemas:
    ExportFile:
      type: object
      properties:
        contents:
          type: string
          format: binary
    SetAvatarInput:
      type: object
      properties:
        avatar:
          type:
            - string
            - 'null'
          format: binary
